swagger: '2.0'
info:
  title: Swagger 2 store
  version: 1.0.0
host: store.example.com
basePath: /api
schemes: [https]
consumes: [application/json]
produces: [application/json]
securityDefinitions:
  bearer:
    type: apiKey
    name: Authorization
    in: header
tags:
  - name: items
paths:
  /items:
    get:
      tags: [items]
      operationId: listItems
      parameters:
        - name: page
          in: query
          type: integer
        - name: kind
          in: query
          type: string
          enum: [small, large]
      responses:
        '200':
          description: items
          schema:
            type: array
            items:
              $ref: '#/definitions/Item'
        default:
          $ref: '#/responses/ErrorResponse'
    post:
      tags: [items]
      operationId: createItem
      security:
        - bearer: []
      parameters:
        - name: item
          in: body
          required: true
          schema:
            $ref: '#/definitions/NewItem'
      responses:
        '201':
          description: created
          schema:
            $ref: '#/definitions/Item'
  /items/{itemId}:
    parameters:
      - name: itemId
        in: path
        required: true
        type: string
    put:
      tags: [items]
      operationId: updateItem
      parameters:
        - name: item
          in: body
          schema:
            $ref: '#/definitions/NewItem'
      responses:
        '200':
          description: updated
          schema:
            $ref: '#/definitions/Item'
    delete:
      tags: [items]
      operationId: deleteItem
      responses:
        '204':
          description: deleted
  /items/{itemId}/image:
    post:
      tags: [items]
      operationId: uploadItemImage
      consumes: [multipart/form-data]
      parameters:
        - name: itemId
          in: path
          required: true
          type: string
        - name: file
          in: formData
          required: true
          type: file
        - name: note
          in: formData
          type: string
      responses:
        '200':
          description: uploaded
          schema:
            $ref: '#/definitions/Item'
responses:
  ErrorResponse:
    description: error
    schema:
      $ref: '#/definitions/Error'
definitions:
  NewItem:
    type: object
    required: [name]
    properties:
      name:
        type: string
      size:
        type: string
        enum: [small, large]
      note:
        type: string
        x-nullable: true
  Item:
    allOf:
      - $ref: '#/definitions/NewItem'
      - type: object
        required: [id]
        properties:
          id:
            type: string
  Error:
    type: object
    required: [message]
    properties:
      message:
        type: string
