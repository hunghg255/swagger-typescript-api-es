name: CI
on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run fmt:check
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - run: node bin/cli.mjs --help

  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/package-lock.json

      # the site links the library from the repository root (file:..) and uses its dist/
      - name: Install and build the library
        working-directory: .
        run: |
          npm ci
          npm run build

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx next build

      - name: Check the /api/generate trace
        run: |
          node -e '
            const files = require("./.next/server/app/api/generate/route.js.nft.json").files;
            const required = ["dist/index.mjs", "dist/templates/base/http-client.ejs", "node_modules/swagger2openapi/", "node_modules/oxfmt/", "oxfmt.linux-x64-gnu.node"];
            const missing = required.filter((r) => !files.some((f) => f.includes(r)));
            if (missing.length) { console.error("missing from the trace:", missing); process.exit(1); }
          '

      # ---- e2e (playwright): runs only when docs/playwright.config.ts exists ----
      - name: Check for playwright config
        id: e2e
        run: echo "enabled=$([ -f playwright.config.ts ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Install Playwright browsers
        if: steps.e2e.outputs.enabled == 'true'
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        if: steps.e2e.outputs.enabled == 'true'
        run: npm run test:e2e
        env:
          E2E_SKIP_BUILD: '1'
          GENERATE_RATE_LIMIT: '0'
      - uses: actions/upload-artifact@v4
        if: failure() && steps.e2e.outputs.enabled == 'true'
        with:
          name: playwright-report
          path: docs/playwright-report
          retention-days: 7
